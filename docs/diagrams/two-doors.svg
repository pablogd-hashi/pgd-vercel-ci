<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Two badges, two doors: Vercel lets the caller in, Vault decides what opens" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a1a1aa"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#18181b">Two badges, two doors: Vercel lets the caller in, Vault decides what opens</text>

  <g fill="none" stroke="#a1a1aa" stroke-width="1.25">
    <path d="M154 160H270" marker-end="url(#arrow2)"/>
    <path d="M470 160H540" marker-end="url(#arrow2)"/>
  </g>

  <g text-anchor="middle">
    <rect x="24" y="130" width="130" height="60" rx="8" fill="none" stroke="#a1a1aa" stroke-width="1.25"/>
    <text x="89" y="156" font-weight="600" fill="#18181b">You</text>
    <text x="89" y="174" font-size="11.5" fill="#52525b">vercel curl</text>

    <rect x="200" y="110" width="10" height="100" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="205" y="100" font-size="11.5" font-weight="600" fill="#18181b">Door 1: Vercel</text>
    <text x="205" y="228" font-size="11.5" fill="#52525b">badge 1:</text>
    <text x="205" y="244" font-size="11.5" fill="#52525b">your Vercel login</text>

    <rect x="270" y="100" width="200" height="140" rx="8" fill="none" stroke="#a1a1aa" stroke-width="1.25"/>
    <text x="370" y="124" font-weight="600" fill="#18181b">Preview deployment</text>
    <rect x="286" y="140" width="168" height="80" rx="8" fill="none" stroke="#a1a1aa" stroke-width="1.25"/>
    <text x="370" y="164" font-weight="600" fill="#18181b">The agent</text>
    <text x="370" y="184" font-size="11.5" fill="#18181b">badge 2: Vercel OIDC token</text>
    <text x="370" y="200" font-size="11.5" fill="#52525b">environment: preview</text>

    <rect x="505" y="110" width="10" height="100" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="510" y="100" font-size="11.5" font-weight="600" fill="#18181b">Door 2: Vault</text>

    <rect x="540" y="115" width="196" height="90" rx="8" fill="none" stroke="#a1a1aa" stroke-width="1.25"/>
    <text x="638" y="139" font-weight="600" fill="#18181b">HCP Vault</text>
    <text x="638" y="159" font-size="11.5" fill="#18181b">checks badge 2 against</text>
    <text x="638" y="175" font-size="11.5" fill="#18181b">the Terraform policies</text>
    <text x="638" y="191" font-size="11.5" fill="#52525b">and decides what opens</text>
  </g>

  <g font-size="11.5" fill="#18181b">
    <circle cx="552" cy="226" r="5" fill="#16a34a"/>
    <text x="564" y="230">preview/* secrets: ALLOW</text>
    <circle cx="552" cy="248" r="5" fill="#dc2626"/>
    <text x="564" y="252">prod/* secrets: DENY 403</text>
    <circle cx="552" cy="270" r="5" fill="#dc2626"/>
    <text x="564" y="274">production role: DENY 400</text>
  </g>

  <text x="24" y="314" font-size="11.5" fill="#52525b">Badge 1 only opens Vercel's door. The caller never holds a Vault credential: it can only ask what the deployment may reach.</text>
</svg>
