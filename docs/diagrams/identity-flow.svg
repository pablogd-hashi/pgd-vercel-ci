<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="The signed environment claim decides what Vault hands back" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a1a1aa"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#18181b">The signed environment claim decides what Vault hands back</text>

  <g fill="none" stroke="#a1a1aa" stroke-width="1.25">
    <path d="M174 100H198" marker-end="url(#arrow)"/>
    <path d="M174 196H198" marker-end="url(#arrow)"/>
    <path d="M368 100H392" marker-end="url(#arrow)"/>
    <path d="M368 196H392" marker-end="url(#arrow)"/>
    <path d="M542 100H566" marker-end="url(#arrow)"/>
    <path d="M542 196H566" marker-end="url(#arrow)"/>
  </g>

  <g text-anchor="middle">
    <rect x="24" y="72" width="150" height="56" rx="8" fill="none" stroke="#a1a1aa" stroke-width="1.25"/>
    <text x="99" y="96" font-weight="600" fill="#18181b">Vercel function</text>
    <text x="99" y="114" font-size="11.5" fill="#52525b">preview deployment</text>

    <rect x="24" y="168" width="150" height="56" rx="8" fill="none" stroke="#a1a1aa" stroke-width="1.25"/>
    <text x="99" y="192" font-weight="600" fill="#18181b">Vercel function</text>
    <text x="99" y="210" font-size="11.5" fill="#52525b">production deployment</text>

    <rect x="198" y="72" width="170" height="56" rx="8" fill="none" stroke="#a1a1aa" stroke-width="1.25"/>
    <text x="283" y="96" font-weight="600" fill="#18181b">OIDC token</text>
    <text x="283" y="114" font-size="11.5" fill="#52525b">environment: preview</text>

    <rect x="198" y="168" width="170" height="56" rx="8" fill="none" stroke="#a1a1aa" stroke-width="1.25"/>
    <text x="283" y="192" font-weight="600" fill="#18181b">OIDC token</text>
    <text x="283" y="210" font-size="11.5" fill="#52525b">environment: production</text>

    <rect x="392" y="72" width="150" height="152" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="467" y="136" font-weight="600" fill="#18181b">Vault JWT auth</text>
    <text x="467" y="156" font-size="11.5" fill="#18181b">verifies signature</text>
    <text x="467" y="172" font-size="11.5" fill="#18181b">checks bound_claims</text>

    <rect x="566" y="72" width="170" height="56" rx="8" fill="none" stroke="#a1a1aa" stroke-width="1.25"/>
    <text x="651" y="96" font-weight="600" fill="#18181b">agent-preview</text>
    <text x="651" y="114" font-size="11.5" fill="#52525b">reads preview/* only</text>

    <rect x="566" y="168" width="170" height="56" rx="8" fill="none" stroke="#a1a1aa" stroke-width="1.25"/>
    <text x="651" y="192" font-weight="600" fill="#18181b">agent-production</text>
    <text x="651" y="210" font-size="11.5" fill="#52525b">reads prod/* only</text>
  </g>

  <text x="24" y="270" font-size="11.5" fill="#52525b">Same code, same environment variables. No Vault token or API key stored anywhere.</text>
</svg>
